name: Download gray
description: Downloads a released gray binary to ./gray, which builds the self-hosted compiler.

inputs:
  tag:
    description: Release tag to download gray from
    default: grayscale-v0.14.1

runs:
  using: composite
  steps:
    - name: Download gray
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG_DOWNLOAD: ${{ inputs.tag }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) asset=gray-linux-amd64 ;;
          Linux-ARM64) asset=gray-linux-arm64 ;;
          macOS-ARM64) asset=gray-darwin-arm64 ;;
          macOS-X64) asset=gray-darwin-amd64 ;;
          *) echo "::error::no released gray for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        gh release download "$RELEASE_TAG_DOWNLOAD" --repo "$GITHUB_REPOSITORY" --pattern "$asset.tar.gz" --dir "$RUNNER_TEMP"
        tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$GITHUB_WORKSPACE" gray
        ./gray version
