# Auto-label PRs based on paths changed
# Used by .github/workflows/auto-label.yml

# Compiler components
self-host:
  - changed-files:
      - any-glob-to-any-file: "selfhost/**"

grayc:
  - changed-files:
      - any-glob-to-any-file: "grayc/**"

lexer:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/src/lexer/**"
          - "selfhost/lexer/**"

parser:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/src/parser/**"
          - "selfhost/parser/**"

typechecker:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/src/typechecker/**"
          - "selfhost/typechecker/**"

stdlib:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/src/stdlib/**"

error-messages:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/src/util/error_codes.h"
          - "ERRORS.md"

# CLI
cli:
  - changed-files:
      - any-glob-to-any-file:
          - "cli/**"

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/tests/**"
          - "integration-tests/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"

# CI/CD
CI/CD:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/labeler.yml"
          - "Makefile"

# Module system (imports, multi-file resolution, name rewriting)
module-system:
  - changed-files:
      - any-glob-to-any-file:
          - "grayc/src/main.c"
