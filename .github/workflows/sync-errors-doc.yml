name: Sync ERRORS.md

on:
  push:
    branches:
      - main
    paths:
      - 'grayc/src/util/error_codes.h'
      - 'ERRORS.md'

jobs:
  sync:
    name: Regenerate ERRORS.md
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build grayc
        run: make grayc build

      - name: Generate ERRORS.md from error_codes.h
        run: |
          ./grayc/grayc scripts/generate_errors.gray
          ./generate_errors

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet ERRORS.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes to main
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ERRORS.md
          git commit -m "docs: regenerate ERRORS.md from error_codes.h"
          git pull --rebase origin main
          git push origin HEAD:main

  trigger-docs:
    name: Trigger docs sync
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs sync
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOCS_REPO_TOKEN }}" \
            https://api.github.com/repos/grayscale-lang/grayscale-lang.github.io/dispatches \
            -d '{"event_type":"sync-errors"}'
