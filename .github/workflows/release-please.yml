name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build binaries for (e.g. grayscale-v0.1.0). Leave empty for normal release-please run.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # Smart auto-merge: only auto-merge release PRs with user-facing changes
  auto-merge-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if PR should auto-merge
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJson(needs.release-please.outputs.pr).number }}
        run: |
          echo "Checking release PR #$PR_NUMBER for auto-merge eligibility..."

          # Get PR body (contains changelog)
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')

          SHOULD_RELEASE=false

          # Check changelog sections for user-facing changes
          # These are generated from conventional commit prefixes:
          # feat:, fix:, perf:, revert:, hotfix:, bugfix:, patch:, feature:
          if echo "$PR_BODY" | grep -qE "^### (Features|Bug Fixes|Performance Improvements|Reverts)"; then
            echo "Found user-facing changes in changelog (Features/Bug Fixes/Perf/Reverts)"
            SHOULD_RELEASE=true
          fi

          # Also check for commit prefixes directly in the PR body
          # This catches non-standard prefixes that might be included
          if [ "$SHOULD_RELEASE" = "false" ]; then
            if echo "$PR_BODY" | grep -qiE "\* (feat|fix|hotfix|bugfix|patch|feature|perf|revert)(\(.+\))?:"; then
              echo "Found release-worthy commit prefix in changelog"
              SHOULD_RELEASE=true
            fi
          fi

          if [ "$SHOULD_RELEASE" = "true" ]; then
            echo "should_merge=true" >> $GITHUB_OUTPUT
            echo "✅ PR qualifies for auto-merge"
          else
            echo "should_merge=false" >> $GITHUB_OUTPUT
            echo "⏸️ PR contains only internal changes (chore/docs/refactor/etc), skipping auto-merge"
            echo "   Release PR will stay open until a feat/fix/hotfix commit is added"
          fi

      - name: Enable auto-merge
        if: steps.check.outputs.should_merge == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_NUMBER: ${{ fromJson(needs.release-please.outputs.pr).number }}
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --squash
          echo "✅ Auto-merge enabled - PR will merge when CI passes"

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || inputs.tag_name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            grayc_arch: linux-amd64
          # Native arm64 runner: grayc is built with the host toolchain, and
          # grayc/Makefile picks its atomics from uname -m, so building this
          # entry on an x86-64 runner ships a compiler for the wrong CPU.
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            grayc_arch: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            grayc_arch: darwin-arm64
          # macos-latest is arm64; macos-13 is the Intel image, needed here
          # for the same reason as the linux-arm64 entry above.
          - os: macos-13
            goos: darwin
            goarch: amd64
            grayc_arch: darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            grayc_arch: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # Pin the toolchain rather than relying on whatever gcc the runner
      # image happens to expose (same rationale as ci.yml's Windows job).
      - name: Install MinGW-w64 and GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw make --no-progress

      # #1461: single-binary release. Build grayc first, stage into the
      # embed directory, then `go build` so the Go CLI bakes the compiler
      # and runtime in as assets.
      - name: Build Grayscale compiler
        shell: bash
        run: |
          cd grayc
          make clean
          make build

      - name: Create embed stubs
        shell: bash
        run: make stubs

      - name: Stage embedded runtime assets
        shell: bash
        run: |
          EXE=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXE=".exe"; fi
          # go:embed reads the literal path runtime/grayc on every platform;
          # the .exe rename happens on extraction (internal/driver/embedded.go).
          cp "grayc/grayc${EXE}" internal/driver/runtime/grayc
          cp grayc/libgrayrt.a internal/driver/runtime/libgrayrt.a
          cp grayc/src/runtime/*.h grayc/src/runtime/*.c internal/driver/runtime/src/runtime/
          cp grayc/src/stdlib/*.h grayc/src/stdlib/*.c internal/driver/runtime/src/stdlib/
          # runtime.c and builtins.c include util/ headers; without them the
          # compile-from-source fallback cannot build (mirrors Makefile staging).
          cp grayc/src/util/*.h internal/driver/runtime/src/util/

      # The embedded compiler is what every gray build/run/check executes, and
      # a wrong-architecture copy still stages and packages cleanly — the
      # failure only shows up as an exec-format error on a user's machine.
      - name: Verify embedded compiler architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ matrix.grayc_arch }}" in
            linux-amd64)  want="x86-64" ;;
            linux-arm64)  want="aarch64" ;;
            darwin-amd64) want="x86_64" ;;
            darwin-arm64) want="arm64" ;;
            *) echo "no architecture check for ${{ matrix.grayc_arch }}"; exit 0 ;;
          esac
          got=$(file -b internal/driver/runtime/grayc)
          echo "embedded grayc: $got"
          case "$got" in
            *"$want"*) echo "matches expected architecture ($want)" ;;
            *) echo "::error::embedded grayc is not $want: $got"; exit 1 ;;
          esac

      - name: Build Grayscale CLI (with embedded runtime)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXE=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXE=".exe"; fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          go build -ldflags "-X main.Version=${RELEASE_TAG} -X main.BuildTime=${BUILD_TIME}" -o "gray${EXE}" ./cli
        shell: bash

      - name: Package single-binary release
        shell: bash
        run: |
          ARCH="${{ matrix.grayc_arch }}"
          mkdir -p staging dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # .zip, not .tar.gz: gray update's extractor picks the format by
            # platform (cli/update.go getAssetName/extractZip).
            cp gray.exe staging/
            (cd staging && 7z a "../dist/gray-${ARCH}.zip" gray.exe)
          else
            cp gray staging/
            tar czf "dist/gray-${ARCH}.tar.gz" -C staging .
          fi

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            [ -f "$f" ] || continue
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done

  # WASM playground update is disabled — the interpreter has been removed.
  # The playground will be ported to Emscripten (grayc + TCC compiled to WASM)
  # in a future release. The pre-built gray.wasm from v2.x still works.
